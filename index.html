<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mother Board</title>
<link id="favicon" rel="icon" type="image/svg+xml" />
<style>
  :root {
    --ivory: #FCFBF7;
    --slate: #141413;
    --clay: #D97757;
    --clay-d: #B85C3E;
    --clay-dd: #A85033;
    --red: #A6433B;
    --oat: #E3DACC;
    --olive: #788C5D;
    --gray-50: #F0EEE6;
    --gray-200: #D1CFC5;
    --gray-500: #87867F;
    --gray-600: #63625C;
    --gray-800: #3D3D3A;
    --white: #ffffff;
    --ivory-50: #FEFEFD;

    --col-rule: rgba(20, 20, 19, 0.07);
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }

  .composer .save,
  .composer .cancel,
  .clear-ask .yes,
  .toast button {
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 4.5px 12px 3.5px;
    cursor: pointer;
  }

  .clear-ask .no,
  .clearbtn {
    background: transparent;
    border: none;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4.5px 2px 3.5px;
    cursor: pointer;
  }
  .clear-ask .no:hover { color: var(--slate); }

  .card-actions button,
  .tips-close {
    --side: 20px;
    width: var(--side);
    height: var(--side);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 4px;
    cursor: pointer;
  }
  .card-actions button:hover,
  .tips-close:hover { border-color: var(--gray-500); color: var(--slate); }

  .composer textarea,
  .card textarea,
  .notes-edit {
    width: 100%;
    resize: vertical;
    background: var(--white);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    color: var(--slate);
    outline: none;
  }

  .palette-panel .cap,
  .card-menu .cap,
  .pal-back,
  .notes-col {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gray-600);
  }

  .date,
  .notemark {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.02em;
  }

  header { margin-bottom: 0; }
  .head-of {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-500);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 6px 0 4px;
  }
  .trail-step {
    font: inherit;
    letter-spacing: inherit;
    color: var(--gray-600);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .trail-step:hover {
    color: var(--slate);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
  }
  .trail-step:focus-visible {
    outline: 2px solid var(--clay);
    outline-offset: 2px;
    border-radius: 2px;
  }
  .trail-sep { color: var(--gray-200); }
  .hintline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-500);
    margin: 10px 0 20px;
  }
  .hintline::before {
    color: var(--clay);
    margin-right: 6px;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ivory);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 0 4px;
    margin-bottom: 14px;
    border-bottom: 1.5px solid var(--gray-200);
  }
  .toolbar.stuck .toolpair { visibility: hidden; }
  .summary {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    letter-spacing: 0.01em;
    margin-right: auto;
  }
  .summary b { color: var(--slate); font-weight: 600; }
  .summary .dot { color: var(--gray-200); margin: 0 4px; }
  .fold {
    background: transparent;
    border: none;
    padding: 0;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1;
    color: var(--clay);
    cursor: pointer;
    transform: rotate(-90deg);
  }
  body.folded .fold { transform: rotate(90deg); }
  .fold:hover { color: var(--clay-d); }
  .fold:focus-visible {
    outline: 2px solid var(--clay);
    outline-offset: 2px;
    border-radius: 2px;
  }
  body.folded header,
  body.folded .toolpair { display: none; }
  body.folded .toolbar .pill { width: auto; }
  body.folded .wrap { padding-top: 0; }
  .toolsep {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-200);
  }
  .tools,
  .toolpair {
    font-family: var(--mono);
    font-size: 11px;
    width: calc(12ch + 36px);
  }
  .tools {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .pill {
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
    padding: 6px 16px 5px;
    text-align: center;
    cursor: pointer;
  }
  .pill:hover,
  .pill[aria-expanded="true"] { border-color: var(--gray-500); }
  .pill:focus-visible {
    outline: none;
    border-color: var(--clay);
    color: var(--clay-d);
  }
  .toolpair {
    flex: none;
    display: flex;
    gap: 6px;
  }
  .toolpair .pill {
    flex: 1;
    padding-left: 6px;
    padding-right: 6px;
  }

  .palette-wrap { position: relative; }
  .palette-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    width: 268px;
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 10px;
    padding: 7px;
    box-shadow: 0 6px 22px rgba(20,20,19,0.10);
    display: none;
    flex-direction: column;
    gap: 1px;
    max-height: 72vh;
    overflow-y: auto;
  }
  .palette-panel.on { display: flex; }
  .palette-panel .cap { padding: 5px 7px 7px; }
  .pal {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 7px;
    border: 1.5px solid transparent;
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .pal:hover { background: var(--gray-50); }
  .pal:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  .pal.on { border-color: var(--clay); }
  .pal-top { display: flex; align-items: baseline; gap: 8px; }
  .pal-name { font-size: 12px; color: var(--slate); }
  .pal-num {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-600);
    font-variant-numeric: tabular-nums;
  }
  .pal-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .pal-bar {
    height: 24px;
    border-radius: 3px;
    border: 1px solid var(--gray-200);
    border-top: 3px solid var(--r);
    background: var(--t);
  }
  .pal-cols {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--gray-600);
    line-height: 1.35;
  }
  .fam-strip { display: flex; flex-wrap: wrap; gap: 4px; }
  .fam-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--c);
    border: 1px solid rgba(20,20,19,0.12);
  }
  .pal-back {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 5px 7px 8px;
    text-align: left;
  }
  .pal-back:hover { color: var(--slate); }
  .pal-back .arrow { color: var(--clay); font-size: 13px; }

  .board {
    display: grid;
    grid-template-columns: 1fr 1px repeat(3, 1fr);
    gap: 16px;
    align-items: start;
  }
  .col-divider {
    align-self: stretch;
    width: 1px;
    background: linear-gradient(
      to bottom,
      transparent 0,
      var(--gray-200) 14%,
      var(--gray-200) 86%,
      transparent 100%
    );
  }
  .col {
    background: var(--fill, var(--ivory));
    border: 1.5px solid var(--gray-200);
    border-top: 3px solid var(--rule, var(--gray-200));
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .col.dragover {
    outline: 2px dashed var(--drop, var(--gray-500));
    outline-offset: -6px;
    overflow: visible;
    background-image: linear-gradient(rgba(217, 119, 87, 0.10), rgba(217, 119, 87, 0.10));
  }
  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 14px 10px;
    border-bottom: 1.5px solid var(--col-rule);
  }
  .col-head h2,
  .notes-col {
    color: var(--head, var(--slate));
  }
  .col-head .glyph {
    display: flex;
    flex: none;
    align-self: center;
    margin-top: 1px;
    color: var(--head, var(--slate));
  }
  .col-head .glyph svg { width: 16px; height: 16px; }
  .col-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 17px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .col-head .count,
  .notes-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    padding: 4px 8px 3px;
    min-width: 26px;
    text-align: center;
  }
  .col-add {
    padding: 10px 10px 0;
  }
  .col-body {
    padding: 6px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-height: 60px;
    position: relative;
  }
  .dropline {
    position: absolute;
    left: -18px;
    right: -18px;
    height: 1px;
    transform: translateY(-50%);
    background: var(--drop, var(--gray-500));
    border-radius: 1px;
    pointer-events: none;
  }
  .empty {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-500);
    text-align: center;
    padding: 18px 6px;
    user-select: none;
  }
  .col-foot {
    border-top: 1.5px solid var(--col-rule);
    padding: 8px 10px 10px;
  }
  .addbtn {
    width: 100%;
    background: transparent;
    border: 1.5px dashed rgba(20, 20, 19, 0.16);
    border-radius: 8px;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8.5px 10px 7.5px;
    cursor: pointer;
    text-align: left;
  }
  .addbtn:hover { border-color: var(--clay); color: var(--clay-d); }
  .addbtn:focus-visible {
    outline: none;
    border-color: var(--clay);
    color: var(--clay-d);
  }

  .composer { display: none; }
  .composer.on { display: block; }
  .composer textarea {
    min-height: 58px;
    border: 1.5px solid var(--gray-500);
    border-radius: 8px;
    padding: 9px 10px;
  }
  .composer textarea:focus { border-color: var(--clay); }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }
  .composer-acts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .composer .save,
  .composer .cancel { padding: 5.5px 12px 4.5px; }
  .composer .save {
    background: var(--slate);
    color: var(--ivory);
    border: 1.5px solid var(--slate);
  }
  .composer .save:hover { background: var(--gray-800); }
  .composer .cancel {
    background: transparent;
    color: var(--gray-600);
    border: 1.5px solid var(--gray-200);
  }
  .composer .cancel:hover { border-color: var(--gray-500); color: var(--slate); }
  .composer .key {
    margin-left: 6px;
    opacity: 0.6;
  }
  .burst {
    background: transparent;
    border: 1.5px dashed rgba(20, 20, 19, 0.16);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
    color: var(--gray-600);
    padding: 4px 8px 3px;
  }
  .burst.on {
    border-style: solid;
    border-color: var(--clay);
    color: var(--clay-d);
  }
  .composer .burst {
    margin-left: auto;
    cursor: pointer;
  }
  .composer .burst:not(.on):hover { border-color: var(--gray-500); color: var(--slate); }

  .clear-row { margin-top: 7px; }
  .clear-row.off { display: none; }
  .clearbtn {
    display: block;
    margin-left: auto;
  }
  .clearbtn:hover { color: var(--clay-d); }
  .clear-ask {
    display: none;
    align-items: center;
    gap: 8px;
  }
  .clear-ask.on { display: flex; }
  .clear-ask .q {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
  }
  .clear-ask .yes {
    margin-left: auto;
    background: var(--white);
    color: var(--clay-d);
    border: 1.5px solid var(--clay-d);
  }
  .clear-ask .yes:hover { box-shadow: 0 0 0 1.5px var(--clay-d); }

  .card {
    background: var(--card, var(--white));
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 10px 11px 8px;
    cursor: grab;
    box-shadow: 0 1px 2px rgba(20,20,19,0.05);
    transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
  }
  .card.head { border-color: color-mix(in srgb, var(--gray-200), var(--gray-500) 55%); }
  .card:hover { border-color: var(--gray-500); box-shadow: 0 2px 5px rgba(20,20,19,0.09); }
  .card:active { cursor: grabbing; }
  .card.pinned { border-color: var(--rule, var(--gray-200)); }

  .card.low,
  .deck.low .card {
    background: rgba(255, 255, 255, 0.55);
    box-shadow: none;
    --fade: 0.42;
  }
  .card.dragging,
  .deck.dragging { opacity: .4; }
  .card.nesting {
    position: relative;
    border-color: var(--drop, var(--gray-500));
    box-shadow: 0 0 0 2px var(--drop, var(--gray-500));
  }
  .card.nesting::after {
    content: attr(data-nest);
    position: absolute;
    right: 10px;
    bottom: -9px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
    color: var(--ivory);
    background: var(--slate);
    border-radius: 999px;
    padding: 4px 8px 3px;
    pointer-events: none;
  }

  .deck {
    --thread: color-mix(in srgb, var(--slate) 22%, var(--fill, var(--ivory)));
    display: flex;
    flex-direction: column;
  }
  .deck-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    opacity: var(--fade, 1);
  }
  .deck-track {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(20, 20, 19, 0.08);
    overflow: hidden;
  }
  .deck-fill {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: var(--clay-d);
  }
  .deck-tally,
  .board-done {
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-600);
  }
  .deckfold {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 18px;
    height: 18px;
    margin: -4px 2px -4px -4px;
    padding: 0;
    color: var(--gray-600);
    background: none;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .deckfold:hover { background: rgba(20, 20, 19, 0.08); color: var(--slate); }
  .deckfold:focus-visible { outline: 2px solid var(--clay); outline-offset: -1px; }
  .deckfold .glyph { display: flex; transition: transform 120ms ease; }
  .deckfold svg { width: 12px; height: 12px; }
  .deckfold[aria-expanded="true"] .glyph { transform: rotate(90deg); }
  .deck:has(> .deck-cards) > .head { position: relative; }
  .deck:has(> .deck-cards) > .head::before {
    content: "";
    position: absolute;
    left: -7px;
    top: 50%;
    bottom: -1px;
    width: 7px;
    border-top: 1.5px solid var(--thread);
    border-left: 1.5px solid var(--thread);
    pointer-events: none;
  }
  .deck-body {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: 2px;
  }
  .deck-body > :not(.dropline) { position: relative; }
  .deck-body > :not(.dropline)::before,
  .deck-body > :not(.dropline)::after {
    content: "";
    position: absolute;
    left: -7px;
    pointer-events: none;
  }
  .deck-body > :not(.dropline)::before {
    top: 50%;
    width: 7px;
    height: 0;
    border-top: 1.5px solid var(--thread);
  }
  .deck-body > :not(.dropline)::after {
    top: -6px;
    bottom: 0;
    width: 0;
    border-left: 1.5px solid var(--thread);
  }
  .deck-body > :last-child::after { bottom: 50%; }
  .deck-rule { border-left: 1.5px solid transparent; }
  .deck-body > .deck-rule::before { content: none; }
  .deck-body > .deck-rule:last-child::after { bottom: calc(50% - 1px); }
  .deck-body > .deck-rule:last-child > span::before { margin-left: -9px; }
  .deck-rule > span {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 2px 3px;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
  }
  .deck-rule > span::before,
  .deck-rule > span::after {
    content: "";
    flex: 1;
    border-top: 1.5px solid var(--thread);
  }
  .deck-add { position: relative; padding: 4px 0 2px; }
  .deck-add .addbtn { padding-top: 5px; padding-bottom: 4px; }
  .deck-add::before {
    content: "";
    position: absolute;
    left: -7px;
    top: -2px;
    bottom: 0;
    width: 0;
    border-left: 1.5px solid transparent;
    border-right: 1.5px solid var(--thread);
    pointer-events: none;
  }
  .card.inner {
    position: relative;
    margin-top: 22px;
    border-top-left-radius: 0;
  }
  .board-tab {
    position: absolute;
    bottom: 100%;
    left: -1px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 7px 4px 9px;
    font-family: var(--mono);
    font-size: 8.5px;
    line-height: 1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gray-800);
    background: inherit;
    border: 1.5px solid;
    border-color: inherit;
    border-bottom: 0;
    border-radius: 7px 7px 0 0;
    cursor: pointer;
  }
  .board-tab:hover { color: var(--clay-d); }
  .board-tab:focus-visible {
    outline: 2px solid var(--clay);
    outline-offset: 1px;
  }
  .board-tab .glyph { display: flex; }
  .board-tab svg { width: 12px; height: 12px; }
  .board-tab .glyph:last-child {
    margin-left: -4px;
    transform: translateY(-1.5px);
  }
  .board-band {
    display: flex;
    gap: 2px;
    height: 5px;
    margin: -10px -11px 9px;
    border-top-right-radius: 6.5px;
    overflow: hidden;
    opacity: var(--fade, 1);
  }
  .board-band.hollow { opacity: 0.3; }
  .board-title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 16px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .board-done {
    margin-bottom: 7px;
    opacity: var(--fade, 1);
  }
  .ctext {
    font-size: 13px;
    line-height: 1.35;
    color: var(--text, var(--slate));
    opacity: var(--fade, 1);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 7px;
  }

  function nestTarget(body, y) {
    if (!drag || drag.deck || drag.board) return null;
    var items = itemsIn(body);
    for (var i = 0; i < items.length; i++) {
      var card = items[i].classList.contains('deck') ? items[i].firstChild : items[i];
      if (card.classList.contains('inner')) continue;
      var box = card.getBoundingClientRect();
      var foot = card.classList.contains('head') ? box.bottom : box.bottom - box.height / 4;
      if (y > box.top + box.height / 4 && y < foot) return card;

    return null;

  var nesting = null;

  function markNest(card, words) {
    if (nesting === card) return;
    if (nesting) {
      nesting.classList.remove('nesting');
      nesting.removeAttribute('data-nest');

    nesting = card;
    if (!card) return;
    card.classList.add('nesting');

      || (card.classList.contains('head') ? 'add to deck' : 'make a deck');

  function itemsIn(body, cls) {

  function insertIndex(body, y, flat) {
    var cards = itemsIn(body);
    var at = slotAt(cards, y);
    if (flat) return at;
    var top = itemsIn(body, '.pinned').length;
    var foot = cards.length - itemsIn(body, '.low').length;
    if (drag && drag.pinned) return Math.min(at, top);
    if (drag && drag.low) return Math.max(at, foot);
    return Math.min(Math.max(at, top), foot);

    var half = (parseFloat(getComputedStyle(body).rowGap) || 0) / 2;
    var mid;
    if (at === 0) {

    } else if (at < cards.length) {
      mid = (cards[at - 1].getBoundingClientRect().bottom +
             cards[at].getBoundingClientRect().top) / 2;
    } else {
      mid = cards[cards.length - 1].getBoundingClientRect().bottom + half;
    }
    if (!dropline) dropline = el('div', 'dropline');

    found.list.splice(found.index, 1);
    found.card.pinned = false;
    found.card.low = false;
    var kids = host.card.cards;

    var top = at.bottom + 6;
    if (top + box.height > window.innerHeight - 8) top = at.top - box.height - 6;

  function editItem(card, text, item, redraw) {
    if (text.parentNode !== card) return;
    var ta = el('textarea');
    ta.value = item.text;
    card.draggable = false;
    card.replaceChild(ta, text);
    takePictures(ta, function () { return item.files; });

    function fit() {
      ta.style.height = 'auto';
      ta.style.height = (ta.scrollHeight + ta.offsetHeight - ta.clientHeight) + 'px';
    }
    ta.addEventListener('input', fit);
    fit();

    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    var done = false;
    function finish(keep) {
      if (done) return;
      done = true;
      card.draggable = true;
      if (keep) {
        var v = ta.value.trim();
        if (v) {
          item.text = v;
          item.files.push.apply(item.files, keptPictures(ta, v));
          save();
        }
      }
      redraw();
    }

    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }

  }

  var attachInput = document.getElementById('attachInput');

  function attach(item, list) {

      .then(function (metas) {

  function chipsOf(item) {

  function dropFiles(item, list) {
    var files = [].slice.call(list);
    var taken = takenBy(item.files);
    var pictures = files.filter(function (f) { return IMAGE.test(f.type); });
    return storeFiles(pictures, function (f) {
      return uniqueName(taken, f.name);
    }).then(function (metas) {
      item.text += metas.map(function (meta) {
        return '\n' + markOf(meta.name);
      }).join('');
      item.files.push.apply(item.files, metas);
      return attach(item, files.filter(function (f) {
        return pictures.indexOf(f) < 0;

    });

  function keptPictures(ta, text) {
    var kept = ta.pictures.filter(function (meta) {
      return text.indexOf(markOf(meta.name)) >= 0;

    return kept;

  function markOf(name) {
    return '![[' + name + ']]';

  function takenBy(metas) {
    var taken = {};
    metas.forEach(function (meta) { taken[meta.name.toLowerCase()] = true; });
    return taken;
  }

  function pictured(item, meta) {
    return item.text.indexOf(markOf(meta.name)) >= 0;
  }

  function picturesOf(data) {
    return [].filter.call(data.items, function (entry) {
      return entry.kind === 'file' && IMAGE.test(entry.type);
    });
  }

  function putPictures(ta, files, owned, from, to) {
    var taken = takenBy(owned.concat(ta.pictures));
    storeFiles(files, function (f) { return uniqueName(taken, f.name); })
      .then(function (metas) {
        ta.pictures.push.apply(ta.pictures, metas);
        ta.setRangeText(metas.map(function (meta) {
          return markOf(meta.name);
        }).join(''), from, to, 'end');
        ta.dispatchEvent(new Event('input'));
      });
  }

  function storeFiles(files, name) {
    var metas = files.map(function (f) {
      return { id: uid(), name: name(f), type: f.type, size: f.size };
    });
    return Promise.all(metas.map(function (meta, i) {
      return filePut(meta.id, files[i]);
    })).then(function () { return metas; });
  }

    ta.pictures = [];

      var files = picturesOf(e.clipboardData).map(fileOf);
      if (!files.length) return;
      e.preventDefault();
      putPictures(ta, files, owned(), ta.selectionStart, ta.selectionEnd);
    });
    ta.addEventListener('dragover', function (e) {
      if (picturesOf(e.dataTransfer).length) e.preventDefault();
    });
    ta.addEventListener('drop', function (e) {
      var files = picturesOf(e.dataTransfer).map(fileOf);
      if (!files.length) return;
      e.preventDefault();
      e.stopPropagation();
      markNest(null);
      var at = document.caretPositionFromPoint(e.clientX, e.clientY).offset;
      putPictures(ta, files, owned(), at, at);

  function makeFiles(item) {

  function codeSpans(s) {

      else if (url.charAt(i) === ')') closes++;

    while (end) {
      var last = url.charAt(end - 1);
      if ('.,;:!?\'"'.indexOf(last) >= 0) end--;
      else if (last === ')' && closes > opens) { closes--; end--; }

    return url.slice(0, end);

      var shown = m ? m[1] : trimTail(part);
      var href = safeHref(m ? m[2] : shown);
      if (!href || !shown.trim()) { out.push({ text: part, code: false }); return; }
      out.push({ text: shown, href: href });

  function calloutOf(s) {
    var at = s.indexOf('\n');
    var m = CALLOUT.exec(at === -1 ? s : s.slice(0, at));
    var type = m && CALLOUTS[m[1].toLowerCase()];
    if (!type) return null;
    return {
      type: type,
      title: m[2] || m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase(),
      body: at === -1 ? '' : s.slice(at + 1)
    };
  }

  function blocks(s, from) {
    var out = [];
    var open = null;
    var lines = s.split('\n');
    var off = from || 0;
    function start(b) { out.push(b); open = b; }
    lines.forEach(function (line, i) {
      var m;
      if (open && open.kind === 'code') {
        if (closesFence(line, open.width)) { open = null; return; }
        open.lines.push(line);
        return;
      }
      if ((m = FENCE.exec(line)) && fenceCloses(lines, i, m[1].length)) {
        start({ kind: 'code', width: m[1].length, lines: [] });
        return;
      }
      if (RULE.test(line)) { out.push({ kind: 'rule' }); open = null; return; }
      if ((m = HEADING.exec(line))) {
        out.push({ kind: 'heading', level: m[1].length, text: m[2] });
        open = null;
        return;
      }
      var w = indentOf(line);
      var host = open && open.kind === 'list' ? hostOf(open.trail, w) : -1;
      if (host >= 0 && (m = QUOTE.exec(line.replace(LEAD, '')))) {
        quoteInto(open.trail[host].item, m[1], off + i);
        open.trail = open.trail.slice(0, host + 1);
        reach(open.trail, off + i);
        return;
      }
      if ((m = QUOTE.exec(line))) {
        if (open && open.kind === 'quote') open.text += '\n' + m[1];
        else start({ kind: 'quote', text: m[1], at: off + i });
        return;
      }
      var bullet = BULLET.exec(line);
      m = bullet || NUMBER.exec(line);
      if (m && (host >= 0 || w <= 3)) {
        var ordered = !bullet;
        var task = bullet && TASK.exec(line);
        var item = { text: task ? task[2] : (ordered ? m[2] : m[1]),
          done: task ? BOXES[task[1].toLowerCase()].done : null,
          mark: task && task[1].toLowerCase(), line: off + i, blocks: [] };
        var list = { kind: 'list', ordered: ordered, start: ordered ? Number(m[1]) : 1,
          items: [item] };
        var under = host >= 0 ? open.trail[host].item.blocks : null;
        var into = under ? under[under.length - 1] : open;
        if (into && into.kind === 'list' && into.ordered === ordered) into.items.push(item);
        else if (under) under.push(list);
        else start(list);
        open.trail = under ? open.trail.slice(0, host + 1) : [];
        open.trail.push({ indent: w, item: item });
        reach(open.trail, off + i);
        return;
      }
      if (host >= 0 && line.trim()) {
        joinText(open.trail[host].item, line.replace(LEAD, ''));
        open.trail = open.trail.slice(0, host + 1);
        reach(open.trail, off + i);
        return;
      }
      if (!line.trim()) { open = null; return; }
      if (open && open.kind === 'para') open.text += '\n' + line;
      else start({ kind: 'para', text: line });
    });
    return out;
  }

  function closesFence(line, width) {
    var m = FENCE.exec(line);
    return !!m && m[1].length >= width && !m[2];
  }

  function fenceCloses(lines, at, width) {
    var i;
    for (i = at + 1; i < lines.length; i++) {
      if (closesFence(lines[i], width)) return true;
    }
    return false;
  }

  function hostOf(trail, w) {
    var k = trail.length - 1;
    while (k >= 0 && w < trail[k].indent + 2) k--;
    return k;
  }

  function indentOf(line) {
    return LEAD.exec(line)[0].replace(/\t/g, '    ').length;
  }

  function joinText(item, s) {
    var last = item.blocks[item.blocks.length - 1];
    if (!last) item.text += '\n' + s;
    else if (last.kind === 'para') last.text += '\n' + s;
    else item.blocks.push({ kind: 'para', text: s });
  }

  function quoteInto(item, s, at) {
    var last = item.blocks[item.blocks.length - 1];
    if (last && last.kind === 'quote') last.text += '\n' + s;
    else item.blocks.push({ kind: 'quote', text: s, at: at });
  }

  function reach(trail, at) {
    trail.forEach(function (step) { step.item.end = at; });
  }

  function makeCard(card, col, deck) {
    var attached = card.board && !deck
      ? function () { openNotes(card.id); } : null;
    var buttons = [
      { icon: 'clip', title: ATTACH,
        onClick: function () { pickFiles(card, attached); } },
      { icon: 'down', title: 'Download this card',
        onClick: function () { exportCard(card.id); } },
      { icon: 'mail', title: 'Send this card by Gmail',
        onClick: function () { mailCard(card.id); },
        cap: 'Gmail opens with the card downloaded.'
          + ' Drag the file onto the message.' }
    ];
    if (!deck) {
      if (!card.board) {
        buttons.unshift({ icon: 'board', title: 'Turn into a board',
          onClick: function () { turnIntoBoard(card.id); } });
      }
      buttons.unshift({ icon: 'pin', title: card.pinned ? 'Unpin' : 'Pin to top',
        onClick: function () { togglePin(card.id); } });
      var at = KEYS.indexOf(col.key);
      if (at > 0) {
        buttons.unshift({ icon: 'left', title: 'Move left',
          onClick: function () { moveCard(card.id, KEYS[at - 1], 0); } });
      }
      if (at < KEYS.length - 1) {
        buttons.unshift({ icon: 'right', title: 'Move right',
          onClick: function () { moveCard(card.id, KEYS[at + 1], 0); } });
      }
    }
    buttons.push({ cls: 'delbtn', icon: 'bin', title: 'Delete',
      onClick: function () { removeCard(card.id); } });
    var item = makeItem(card, {
      level: 'card',
      redraw: render,
      mark: noteMark(card),
      markCls: card.notes.length ? '' : 'add',
      onMark: function () { openNotes(card.id, card.notes.length ? null : 'compose'); },
      onEdit: function (at) { openNotes(card.id, 'edit', at); },
      pinned: card.pinned,
      low: !card.pinned && !deck ? card.low : null,
      onLow: function () { toggleLow(card.id); },
      head: card.board && !deck
        ? fillCode(el('div', 'board-title'), cardTitle(card)) : null,
      hideFiles: card.board && !deck,
      attached: attached,
      buttons: buttons
    });
    if (card.board && !deck) {
      item.classList.add('inner');
      item.insertBefore(makeBoardBand(card.board), item.firstChild);
      item.insertBefore(makeBoardTab(card), item.firstChild);
      item.insertBefore(
        el('div', 'board-done', boardDone(card.board)), item.lastChild);
    }
    return item;
  }

  function boardDone(board) {
    if (!boardSize(board)) return 'empty board';
    var all = ['backlog', 'now', 'accomplished'].reduce(function (n, k) {
      return n + sizeOf(board.cols[k]);
    }, 0);
    return sizeOf(board.cols.accomplished) + ' of ' + all + ' done';
  }

  function makeBoardBand(board) {
    var band = el('div', 'board-band');
    var colors = turned(paletteOf(board.palette).colors, board.turn || 0);
    var empty = !boardSize(board);
    if (empty) band.classList.add('hollow');
    COLUMNS.forEach(function (c) {
      var n = sizeOf(board.cols[c.key]);
      if (!n && !empty) return;
      var part = el('span');
      part.style.flexGrow = empty ? 1 : n;
      part.style.background =
        c.palette ? colors[PAL_COLUMNS.indexOf(c)] : c.rule;
      band.appendChild(part);
    });
    return band;
  }

  function makeBoardTab(card) {
    var tab = textBtn('board-tab', 'board');
    tab.setAttribute('aria-label', 'Open the board ' + cardTitle(card));
    tab.insertBefore(icon('board'), tab.firstChild);
    tab.appendChild(icon('chev'));
    tab.addEventListener('click', function () {
      enter(path.concat(card.id));
    });
    return tab;
  }

  function turnIntoBoard(id) {
    var card = find(id).card;
    card.board = blank();
    card.board.cols.backlog = card.cards;
    card.board.palette = currentPal;
    card.board.turn = palTurn;
    card.cards = [];
    delete card.folded;
    delete card.doneFolded;
    commit();
  }

  var deckAdd = null;

  function makeDeck(card, col) {
    var deck = el('section', 'deck');
    deck.dataset.id = card.id;
    if (card.pinned) deck.classList.add('pinned');
    if (card.low) deck.classList.add('low');

    var head = makeCard(card, col);
    head.classList.add('head');
    var bot = head.lastChild;
    bot.insertBefore(makeFold(card, 'folded', 'the deck'), bot.firstChild);

    var done = card.cards.filter(isDone);
    var open = card.cards.filter(function (c) { return !isDone(c); });
    var bar = el('div', 'deck-bar');
    var track = el('span', 'deck-track');
    var fill = el('span', 'deck-fill');
    fill.style.width = (100 * done.length / card.cards.length) + '%';
    track.appendChild(fill);
    bar.appendChild(track);
    bar.appendChild(el('span', 'deck-tally', done.length + ' of ' + card.cards.length + ' done'));
    head.insertBefore(bar, bot);
    deck.appendChild(head);
    if (card.folded) return deck;

    var zone = el('div', 'deck-cards');
    var top = el('div', 'deck-add');
    makeComposer(top, {
      add: '+ add to deck',
      placeholder: 'What else belongs here?',
      onAdd: function (text, files) {
        card.cards.unshift(newItem(text, files));
        deckAdd = { id: card.id, open: burst };
        commit();
      }
    });
    zone.appendChild(top);

    var body = el('div', 'deck-body');
    var make = function (c) { return makeCard(c, col, card); };
    open.forEach(function (c) { body.appendChild(make(c)); });
    if (done.length) {
      var rule = el('div', 'deck-rule');
      var tally = el('span', null, done.length + ' done');
      tally.insertBefore(makeFold(card, 'doneFolded', 'the done cards'), tally.firstChild);
      rule.appendChild(tally);
      body.appendChild(rule);
      if (!card.doneFolded) done.forEach(function (c) { body.appendChild(make(c)); });
    }
    zone.appendChild(body);
    deck.appendChild(zone);
    wireDrop(zone, body, {
      level: 'card',
      flat: true,
      onDrop: function (id, at) {
        var next = itemsIn(body)[at];
        joinDeck(id, card.id, next ? next.dataset.id : null);
      }
    });
    return deck;
  }

  function makeFold(card, key, what) {
    var fold = textBtn('deckfold');
    fold.setAttribute('aria-expanded', card[key] ? 'false' : 'true');
    fold.setAttribute('aria-label', (card[key] ? 'Unfold ' : 'Fold ') + what);
    fold.appendChild(icon('chev'));
    fold.addEventListener('click', function () {
      card[key] = !card[key];
      keepBoard(JSON.stringify(state));
      render();
    });
    return fold;
  }

  function makeNote(note) {
    return makeItem(note, {
      level: 'note',
      redraw: redrawNotes,
      deleteTitle: 'Delete note',
      onDelete: function () { removeNote(note.id); },
      clip: true,
      buttons: []
    });
  }

  function noteMark(card) {
    return card.notes.length ? plural(card.notes.length, 'note') : 'add note';
  }

  function fillBody(body, items, emptyText, make) {
    body.innerHTML = '';
    if (!items.length) {
      body.appendChild(el('div', 'empty', emptyText));
      return;
    }
    items.forEach(function (item) { body.appendChild(make(item)); });
  }

  function lastMark(items) {
    var i, j, mark;
    for (i = items.length - 1; i >= 0; i--) {
      for (j = items[i].blocks.length - 1; j >= 0; j--) {
        if (items[i].blocks[j].kind !== 'list') continue;
        mark = lastMark(items[i].blocks[j].items);
        if (mark !== null) return mark;
      }
      if (items[i].done !== null) return items[i].done;
    }
    return null;
  }

  function boxesOf(list) {
    var out = [];
    list.forEach(function (b) {
      if (b.kind === 'list') {
        b.items.forEach(function (item) {
          if (item.done !== null) out.push(item.done);
          out = out.concat(boxesOf(item.blocks));
        });
      }
      var call = b.kind === 'quote' && calloutOf(b.text);
      if (call) out = out.concat(boxesOf(blocks(call.body)));
    });
    return out;
  }

  function isDone(card) {
    var boxes = boxesOf(blocks(card.text));
    return boxes.length > 0 && boxes.every(Boolean);
  }

  function fillBlocks(host, list, owner) {
    var fade = false;
    list.forEach(function (b) {
      var node = makeBlock(b, owner);
      if (b.kind === 'list') {
        var mark = lastMark(b.items);
        if (mark !== null) fade = mark;
      } else if (fade) {
        node.classList.add('done');
      }
      host.appendChild(node);
    });
  }

  function makeBlock(b, owner) {
    if (b.kind === 'rule') return document.createElement('hr');
    if (b.kind === 'code') {
      var pre = document.createElement('pre');
      var block = document.createElement('code');
      block.textContent = b.lines.join('\n');
      pre.appendChild(block);
      return pre;
    }
    if (b.kind === 'list') {
      var list = document.createElement(b.ordered ? 'ol' : 'ul');
      if (b.ordered && b.start !== 1) list.start = b.start;
      b.items.forEach(function (item, at) {
        var li = document.createElement('li');
        var what = li;
        var words = li;
        if (item.done !== null) {
          li.className = item.done ? 'task done' : 'task';
          if (BOXES[item.mark].look) li.classList.add(BOXES[item.mark].look);
          li.appendChild(taskBox(item, owner));
          what = el('div', 'task-what');
          li.appendChild(what);
          words = el('span', 'task-words');
          what.appendChild(words);
        }
        fillInline(words, item.text);
        item.blocks.forEach(function (sub) {
          what.appendChild(makeBlock(sub, owner));
        });
        var grip = el('span', 'grip');
        grip.appendChild(icon('grip'));
        grip.addEventListener('mousedown', function (e) {
          liftItem(e, li, b, at, owner);
        });
        li.appendChild(grip);
        list.appendChild(li);
      });
      return list;
    }
    if (b.kind === 'quote') {
      var call = calloutOf(b.text);
      if (call) return makeCallout(call, b.at + 1, owner);
    }
    var box = document.createElement(b.kind === 'heading' ? 'h' + b.level
      : b.kind === 'quote' ? 'blockquote' : 'p');
    fillInline(box, b.text);
    return box;
  }

  function makeCallout(call, from, owner) {
    var box = el('div', 'callout ' + call.type);
    var head = el('div', 'callout-head');
    head.appendChild(icon(call.type));
    head.appendChild(el('span', '', call.title));
    box.appendChild(head);
    if (call.body.trim()) {
      var body = el('div', 'callout-body');
      fillBlocks(body, blocks(call.body, from), owner);
      box.appendChild(body);
    }
    return box;
  }

  function taskBox(task, owner) {
    var box = textBtn('tickbox');
    box.setAttribute('role', 'checkbox');
    box.setAttribute('aria-checked', task.done ? 'true' : 'false');
    box.setAttribute('aria-label', task.text);
    var glyph = BOXES[task.mark].glyph;
    if (glyph) box.appendChild(icon(glyph));
    box.addEventListener('click', function () {
      toggleTask(owner, task.line);
    });
    return box;
  }

  function unquoted(line) {
    var m;
    while ((m = QUOTE.exec(line.replace(LEAD, '')))) line = m[1];
    return line;
  }

  function toggleTask(item, at) {
    var lines = item.text.split('\n');
    var m = TASK.exec(unquoted(lines[at]));
    if (!m) return;
    lines[at] = lines[at].replace(BOX,
      '[' + BOXES[m[1].toLowerCase()].next + ']');
    item.text = lines.join('\n');
    commit();
  }

  function dragLift(y) {
    var list = lift.li.parentNode;
    lift.li.classList.add('moving');
    var rest = [].slice.call(list.querySelectorAll(':scope > li:not(.moving)'));
    lift.to = slotAt(rest, y);
    placeDropline(list, rest, lift.to);
  }

  function dropLift() {
    var held = lift;
    lift = null;
    held.li.classList.remove('moving');
    hideDropline();
    if (held.to !== held.at) {
      moveListItem(held.owner, held.list, held.at, held.to);
    }
  }

  function liftItem(e, li, list, at, owner) {
    e.preventDefault();
    lift = { li: li, list: list, at: at, to: at, owner: owner };
  }

  function moveListItem(owner, list, from, to) {
    var lines = owner.text.split('\n');
    var items = list.items;
    var parts = items.map(function (item) {
      return lines.slice(item.line, item.end + 1);
    });
    parts.splice(to, 0, parts.splice(from, 1)[0]);
    if (list.ordered) {
      parts.forEach(function (part, k) {
        part[0] = numberLike(part[0], lines[items[k].line]);
      });
    }
    var moved = [].concat.apply([], parts);
    lines.splice.apply(lines, [items[0].line, moved.length].concat(moved));
    owner.text = lines.join('\n');
    commit();
  }

  function numberLike(line, like) {
    var bare = unquoted(line);
    var number = NUMBER.exec(unquoted(like))[1];
    return line.slice(0, line.length - bare.length)
      + bare.replace(/\d+/, number);
  }

  document.addEventListener('mousemove', function (e) {
    if (lift) dragLift(e.clientY);
  });
  document.addEventListener('mouseup', function () {
    if (lift) dropLift();
  });

  function renderText(el, owner) {
    el.textContent = '';
    fillBlocks(el, blocks(owner.text), owner);
    showPictures(el, owner);
  }

  var pictureUrls = {};

  function pictureOf(meta) {
    var img = el('img', 'pic');
    img.alt = meta.name;
    img.draggable = false;
    img.addEventListener('click', function () { openFile(meta); });
    urlOf(meta).then(function (url) { img.src = url; });
    return img;
  }

  function showPictures(root, owner) {
    var walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var found = [];
    while (walk.nextNode()) {
      if (PICTURE.test(walk.currentNode.data)) found.push(walk.currentNode);
    }
    found.forEach(function (node) {
      var into = document.createDocumentFragment();
      node.data.split(PICTURE).forEach(function (bit, i) {
        var meta = i % 2 ? pick(owner.files, function (f) {
          return f.name === bit;
        }) : null;
        into.appendChild(meta ? pictureOf(meta)
          : document.createTextNode(i % 2 ? markOf(bit) : bit));
      });
      node.parentNode.replaceChild(into, node);
    });
  }

  function urlOf(meta) {
    pictureUrls[meta.id] = pictureUrls[meta.id]
      || fileGet(meta.id).then(function (blob) {
        return URL.createObjectURL(blob);
      });
    return pictureUrls[meta.id];
  }

  function fillCode(node, s) {
    codeSpans(s).forEach(function (seg) {
      node.appendChild(seg.code
        ? el('code', null, seg.text) : document.createTextNode(seg.text));
    });
    return node;
  }

  function fillInline(el, s) {
    inlineSpans(s).forEach(function (seg) {
      if (seg.href) {
        var a = document.createElement('a');
        a.href = seg.href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.draggable = false;
        a.textContent = seg.text;
        if (seg.text !== seg.href) a.title = seg.href;
        el.appendChild(a);
      } else if (seg.code) {
        var code = document.createElement('code');
        code.textContent = seg.text;
        el.appendChild(code);
      } else if (seg.tag) {
        var mark = document.createElement(seg.tag);
        mark.textContent = seg.text;
        el.appendChild(mark);
      } else {
        el.appendChild(document.createTextNode(seg.text));
      }
    });
  }

  var scrim = document.getElementById('scrim');
  var notesPanel = document.getElementById('notes');
  var notesBody = document.getElementById('notesBody');
  var notesWhat = document.getElementById('notesWhat');
  var whatEdit = el('textarea', 'notes-edit');
  var editingWhat = false;
  var openCardId = null;

  notesWhat.parentNode.appendChild(whatEdit);
  takePictures(whatEdit, function () { return find(openCardId).card.files; });
  var notesFiles = el('div');
  notesWhat.parentNode.appendChild(notesFiles);

  var notesComposer = makeComposer(document.getElementById('notesFoot'), {
    add: '+ add a note',
    placeholder: 'What is worth remembering?',
    inner: true,
    onAdd: function (text, files) {
      var list = notesList();
      if (!list) return;
      list.push(newItem(text, files));
      commit();
    }
  });

  function notesList() {
    var found = openCardId ? find(openCardId) : null;
    return found ? found.card.notes : null;
  }

  function editWhat() {
    var found = openCardId ? find(openCardId) : null;
    if (!found || editingWhat) return;
    editingWhat = true;
    whatEdit.value = found.card.text;
    whatEdit.pictures = [];
    notesWhat.style.display = 'none';
    whatEdit.classList.add('on');
    fitWhat();
    whatEdit.focus();
    whatEdit.setSelectionRange(whatEdit.value.length, whatEdit.value.length);
  }

  function fitWhat() {
    whatEdit.style.height = 'auto';
    whatEdit.style.height =
      (whatEdit.scrollHeight + whatEdit.offsetHeight - whatEdit.clientHeight) + 'px';
  }

  function finishWhat(keep) {
    if (!editingWhat) return;
    editingWhat = false;
    whatEdit.classList.remove('on');
    notesWhat.style.display = '';
    var found = openCardId ? find(openCardId) : null;
    var text = whatEdit.value.trim();
    if (keep && found && text && text !== found.card.text) {
      found.card.text = text;
      found.card.files.push.apply(found.card.files,
        keptPictures(whatEdit, text));
      commit();
      return;
    }
    redrawNotes();
  }

  var EDGE = 12;
  var LEAST = 250;
  var HEAD_ROOM = 170;

  function anchorNotes(at) {
    var pad = getComputedStyle(whatEdit);
    var box = whatEdit.getBoundingClientRect();
    var panel = notesPanel.getBoundingClientRect();
    var dx = box.left + whatEdit.clientLeft + parseFloat(pad.paddingLeft) - panel.left;
    var dy = box.top + whatEdit.clientTop + parseFloat(pad.paddingTop) - panel.top;
    var left = Math.max(EDGE, Math.min(at.left - dx, window.innerWidth - LEAST - EDGE));
    var top = Math.max(EDGE, Math.min(at.top - dy, window.innerHeight - LEAST - EDGE));
    var wide = Math.min(panel.width, window.innerWidth - left - EDGE);
    var tall = Math.min(panel.height, window.innerHeight - top - EDGE);

    notesPanel.classList.add('placed');
    notesPanel.style.left = left + 'px';
    notesPanel.style.top = top + 'px';
    notesPanel.style.width = wide + 'px';
    notesPanel.style.height = tall + 'px';
    var deep = Math.max(90, tall - HEAD_ROOM);
    whatEdit.style.minHeight = Math.min(140, deep) + 'px';
    whatEdit.style.maxHeight = deep + 'px';
    fitWhat();
  }

  function loosenNotes() {
    notesPanel.classList.remove('placed');
    notesPanel.style.left = '';

  var CRCS = crcTable();

  function boardHolders(board) {
    return KEYS.reduce(function (out, k) {

  function crc32(bytes) {
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
      crc = CRCS[(crc ^ bytes[i]) & 255] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function crcTable() {
    var table = [];
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      table.push(c >>> 0);
    }
    return table;
  }

  function packed(fields) {
    var view = new DataView(new ArrayBuffer(fields.length * 4));
    var at = 0;
    fields.forEach(function (f) {
      if (f[1] === 2) view.setUint16(at, f[0], true);
      else view.setUint32(at, f[0], true);
      at += f[1];
    });
    return new Uint8Array(view.buffer, 0, at);
  }

  function safeName(name) {
    return name.replace(/[\\\/:*?"<>|\x00-\x1f]/g, '-');

  function saveBlob(file, blob) {

    a.href = url;

  }

  function unique(taken, stem, ext) {
    var out = stem + ext;
    for (var n = 2; taken[out.toLowerCase()]; n++) {
      out = stem + ' (' + n + ')' + ext;
    }
    taken[out.toLowerCase()] = true;
    return out;
  }

  function uniqueName(taken, name) {
    var dot = name.lastIndexOf('.');
    if (dot <= 0) dot = name.length;
    return unique(taken, name.slice(0, dot), name.slice(dot));
  }

  function unpack(blobs, entries) {
    return Promise.all(Object.keys(blobs).map(function (id) {
      var got = entries ? Promise.resolve(entries[blobs[id]])
        : fetch(blobs[id]).then(function (r) { return r.blob(); });
      return got.then(function (blob) { return filePut(id, blob); });
    }));
  }

  function unzip(file) {
    return file.arrayBuffer().then(function (buffer) {
      var view = new DataView(buffer);
      var end = buffer.byteLength - 22;
      while (view.getUint32(end, true) !== 0x06054b50) end--;
      var at = view.getUint32(end + 16, true);
      var out = {};
      for (var i = view.getUint16(end + 10, true); i > 0; i--) {
        var named = view.getUint16(at + 28, true);
        var local = view.getUint32(at + 42, true);
        var start = local + 30 + view.getUint16(local + 26, true)
          + view.getUint16(local + 28, true);
        var path = new TextDecoder()
          .decode(new Uint8Array(buffer, at + 46, named));
        var data = file.slice(start, start + view.getUint32(at + 20, true));
        out[path] = view.getUint16(at + 10, true) === 8
          ? new Response(data.stream().pipeThrough(
            new DecompressionStream('deflate-raw'))).blob()
          : data;
        at += 46 + named + view.getUint16(at + 30, true)
          + view.getUint16(at + 32, true);
      }
      return out;
    });
  }

  function zip(entries) {
    var now = new Date();
    var time = (now.getHours() << 11) | (now.getMinutes() << 5)
      | (now.getSeconds() >> 1);
    var date = ((now.getFullYear() - 1980) << 9)
      | ((now.getMonth() + 1) << 5) | now.getDate();
    return Promise.all(entries.map(function (e) {
      return e.blob.arrayBuffer();
    })).then(function (buffers) {
      var parts = [];
      var dir = [];
      var at = 0;
      buffers.forEach(function (buffer, i) {
        var bytes = new Uint8Array(buffer);
        var name = new TextEncoder().encode(entries[i].path);
        var common = [[0x800, 2], [0, 2], [time, 2], [date, 2],
          [crc32(bytes), 4], [bytes.length, 4], [bytes.length, 4],
          [name.length, 2], [0, 2]];
        var head = packed([[0x04034b50, 4], [20, 2]].concat(common));
        dir.push(packed([[0x02014b50, 4], [0x031E, 2], [20, 2]].concat(common,
          [[0, 2], [0, 2], [0, 2], [0x81A40000, 4], [at, 4]])), name);
        parts.push(head, name, bytes);
        at += head.length + name.length + bytes.length;
      });
      var size = dir.reduce(function (n, part) { return n + part.length; }, 0);
      var end = packed([[0x06054b50, 4], [0, 2], [0, 2],
        [entries.length, 2], [entries.length, 2], [size, 4], [at, 4], [0, 2]]);
      return new Blob(parts.concat(dir, [end]), { type: 'application/zip' });
    });
  }

  function zipped(data, holders) {
    var blobs = {};
    var folders = {};
    var files = [];
    holders.forEach(function (item) {
      var folder = unique(folders, safeName(cardTitle(item)), '');
      var names = {};
      item.files.forEach(function (meta) {
        var path = folder + '/' + uniqueName(names, safeName(meta.name));
        blobs[meta.id] = path;
        files.push({ path: path, id: meta.id });
      });
    });
    var json = { path: data.card ? 'card.json' : 'board.json',
      blob: new Blob([JSON.stringify(
        Object.assign({}, data, { blobs: blobs }), null, 2)]) };
    return Promise.all(files.map(function (f) {
      return fileGet(f.id).then(function (blob) {
        return { path: f.path, blob: blob };
      });
    })).then(function (got) { return zip([json].concat(got)); });
  }

      var root = json.slice(0, json.lastIndexOf('/') + 1);

      Object.keys(found).forEach(function (path) {

      return Promise.resolve(found[json]).then(function (blob) {

      { id: 'w291', name: "Light Green Yellow & Cobalt Green", num: 291,
        colors: ['#00B49B', '#C7D14F', '#96D1AA'],
        lead: '#00B49B',
        names: 'Sea Green · Light Green Yellow · Cobalt Green' }
    ] },
    { id: 'drab', name: 'Drab', note: 'muted, warm earth', palettes: [
      { id: 'w276', name: "Eosine Pink & Yellow Green", num: 276,
        colors: ['#111314', '#F37F94', '#AFD472'],
        lead: '#AFD472',
        names: 'Black · Eosine Pink · Yellow Green' },
      { id: 'w263', name: "Burnt Sienna & Turquoise Green", num: 263,
        colors: ['#34454C', '#AE5224', '#B5DECC'],
        lead: '#AE5224',
        names: 'Slate Color · Burnt Sienna · Turquoise Green' }
    ] },
    { id: 'ash', name: 'Ash', note: 'muted, cool grey', palettes: [
      { id: 'w290', name: "Pale Lemon Yellow & Cobalt Green", num: 290,
        colors: ['#6D4145', '#FFEFAE', '#96D1AA'],
        lead: '#96D1AA',
        names: 'Vistoris Lake · Pale Lemon Yellow · Cobalt Green' },
      { id: 'w294', name: "Cream Yellow & Cossack Green", num: 294,
        colors: ['#97ACC8', '#FDBF68', '#437742'],
        lead: '#437742',
        names: 'Salvia Blue · Cream Yellow · Cossack Green' },
      { id: 'w341', name: "Light Glaucous Blue & Cossack Green", num: 341,
        colors: ['#F48067', '#A5C8D1', '#437742'],
        lead: '#437742',
        names: 'Grenadine Pink · Light Glaucous Blue · Cossack Green' }
    ] }
  ];

  var PALETTES = [];
  FAMILIES.forEach(function (f) {
    f.palettes.forEach(function (p) { p.family = f; PALETTES.push(p); });
  });

  var DEFAULT_PAL = 'w262';

  function rgbOf(hex) {
    var h = hex.replace('#', '');
    return [0, 1, 2].map(function (i) { return parseInt(h.substr(i * 2, 2), 16); });
  }

  function shadeOf(hex, k) {
    var far = k == null ? SHADE : k;
    return '#' + rgbOf(hex).map(function (v) {
      var m = Math.round(v * (1 - far));
      return ('0' + m.toString(16)).slice(-2);
    }).join('').toUpperCase();
  }

  function lumOf(hex) {
    var parts = rgbOf(hex).map(function (v) {
      var c = v / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * parts[0] + 0.7152 * parts[1] + 0.0722 * parts[2];
  }

  function ratioOf(a, b) {
    var x = lumOf(a);
    var y = lumOf(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }

  function inkOf(hex) {
    var fill = tintOf(hex);
    var ink = hex;
    var far = 0;
    while (ratioOf(ink, fill) < MARK_RATIO && far < 1) {
      far += 0.01;
      ink = shadeOf(hex, far);
    }
    return ink;
  }

  function tintOf(hex) {
    var under = rgbOf(IVORY);
    return '#' + rgbOf(hex).map(function (v, i) {
      var m = Math.round(v * TINT + under[i] * (1 - TINT));
      return ('0' + m.toString(16)).slice(-2);
    }).join('').toUpperCase();
  }

  function setFavicon(colors) {
    var link = document.getElementById('favicon');
    if (!link) return;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
      '<rect width="32" height="32" rx="7" fill="' + IVORY + '"/>';
    colors.forEach(function (c, i) {
      svg += '<rect x="' + (4 + i * 9) + '" y="5" width="6" height="22" rx="2" fill="' + c + '"/>';
    });
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svg + '</svg>');
  }

  var tone = {};
  COLUMNS.forEach(function (c) {
    tone[c.key] = { fill: c.fill, rule: c.rule, drop: c.drop };
  });

  function paint(target, key) {
    target.style.setProperty('--fill', tone[key].fill);
    target.style.setProperty('--rule', tone[key].rule);
    target.style.setProperty('--drop', tone[key].drop);
    if (tone[key].ink) target.style.setProperty('--ink', tone[key].ink);
    else target.style.removeProperty('--ink');
    ['card', 'text', 'head'].forEach(function (name) {
      var own = colOf(key)[name];
      if (own) target.style.setProperty('--' + name, own);
      else target.style.removeProperty('--' + name);
    });
  }

  function turned(list, n) {
    return n % 2 ? [list[1], list[0]].concat(list.slice(2)) : list.slice();
  }

  function colorsOf(p) {
    return p.id === currentPal ? turned(p.colors, palTurn) : p.colors;
  }
  function namesOf(p) {
    return turned(p.names.split(' · '), p.id === currentPal ? palTurn : 0).join(' · ');
  }

  function paletteOf(id) {
    return pick(PALETTES, function (x) { return x.id === id; }) ||
      pick(PALETTES, function (x) { return x.id === DEFAULT_PAL; });
  }

  function applyPalette(id, turn) {
    var p = paletteOf(id);
    currentPal = p.id;
    palTurn = ((turn || 0) % 2 + 2) % 2;
    var colors = colorsOf(p);
    PAL_COLUMNS.forEach(function (c, i) {
      tone[c.key] = {
        fill: tintOf(colors[i]), rule: colors[i], drop: shadeOf(colors[i]),
        ink: inkOf(colors[i])
      };
    });
    KEYS.forEach(function (k) { paint(views[k].el, k); });
    redrawNotes();
    setFavicon(colors);
  }

  var palPanel = document.getElementById('palettePanel');
  var palBtn = document.getElementById('paletteBtn');
  var palView = null;
  var currentPal = DEFAULT_PAL;
  var palTurn = 0;

  function palButton(spec) {
    var b = textBtn('pal');
    var top = el('span', 'pal-top');
    top.appendChild(el('span', 'pal-name', spec.name));
    top.appendChild(el('span', 'pal-num', spec.num));
    b.appendChild(top);
    b.appendChild(spec.strip);
    b.appendChild(el('span', 'pal-cols', spec.note));
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      spec.onClick();
    });
    return b;
  }

  function palBars(colors) {
    var bars = el('span', 'pal-bars');
    colors.forEach(function (c) {
      var bar = el('span', 'pal-bar');
      bar.style.setProperty('--r', c);
      bar.style.setProperty('--t', tintOf(c));
      bars.appendChild(bar);
    });
    return bars;
  }

  function famDots(f) {
    var dots = el('span', 'fam-strip');
    f.palettes.forEach(function (p) {
      var dot = el('span', 'fam-dot');
      dot.style.setProperty('--c', p.lead);
      dots.appendChild(dot);
    });
    return dots;
  }

  function renderPanel() {
    palPanel.innerHTML = '';
    if (palView) renderFamily(pick(FAMILIES, function (f) { return f.id === palView; }));
    else renderFamilies();
  }

  function renderFamilies() {
    palPanel.appendChild(el('div', 'cap', 'Sanzo Wada · 24 combinations, each with a green'));
    FAMILIES.forEach(function (f) {
      var b = palButton({
        name: f.name,
        num: String(f.palettes.length),
        strip: famDots(f),
        note: f.note,
        onClick: function () { palView = f.id; renderPanel(); }
      });
      b.dataset.fam = f.id;
      if (pick(f.palettes, function (p) { return p.id === currentPal; })) b.classList.add('on');
      palPanel.appendChild(b);
    });
  }

  function renderFamily(f) {
    var back = textBtn('pal-back');
    back.appendChild(el('span', 'arrow', '‹'));
    back.appendChild(document.createTextNode(' all families · ' + f.name));
    back.addEventListener('click', function (e) {
      e.stopPropagation();
      palView = null;
      renderPanel();
    });
    palPanel.appendChild(back);
    palPanel.appendChild(el('div', 'cap', 'Click the one on the board again to swap Backlog and Now'));

    f.palettes.forEach(function (p) {
      var b = palButton({
        name: p.name,
        num: p.num ? 'no. ' + p.num : 'default',
        strip: palBars(colorsOf(p)),
        note: namesOf(p),
        onClick: function () {
          applyPalette(p.id, p.id === currentPal ? palTurn + 1 : 0);
          here().palette = currentPal;
          here().turn = palTurn;
          save();
          markPalettes();
        }
      });
      b.dataset.pal = p.id;
      if (p.id === currentPal) b.classList.add('on');
      palPanel.appendChild(b);
    });
  }

  function markPalettes() {
    palPanel.querySelectorAll('.pal').forEach(function (b) {
      var p = pick(PALETTES, function (x) { return x.id === b.dataset.pal; });
      if (!p) return;
      b.classList.toggle('on', p.id === currentPal);
      b.replaceChild(palBars(colorsOf(p)), b.querySelector('.pal-bars'));
      b.querySelector('.pal-cols').textContent = namesOf(p);
    });
  }

  function openPalette() {
    palView = null;
    renderPanel();
    palPanel.classList.add('on');
    palBtn.setAttribute('aria-expanded', 'true');
  }
  function closePalette() {
    palPanel.classList.remove('on');
    palBtn.setAttribute('aria-expanded', 'false');
  }
  palBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (palPanel.classList.contains('on')) closePalette(); else openPalette();
  });
  document.addEventListener('click', function (e) {
    if (!palPanel.contains(e.target) && e.target !== palBtn) closePalette();
    if (!menu.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var owner = menuOwner;
    if (closeMenu()) { owner.focus(); return; }
    closePalette();
    closeClearAsks();
    closeNotes();
    closeTips();
  });
  document.addEventListener('keydown', function (e) {
    var go = { z: undo, y: redo }[e.key];
    if (!e.ctrlKey || !go || e.target.closest('textarea')) return;
    e.preventDefault();
    go();
  });

  function show() {
    applyPalette(here().palette, here().turn);
    render();
  }

  var toolbar = document.getElementById('toolbar');
  var markStuck = function () {
    toolbar.classList.toggle('stuck', toolbar.getBoundingClientRect().top <= 0);
  };
  window.addEventListener('scroll', markStuck, { passive: true });
  markStuck();

  var FOLD_KEY = 'personal.fold.v1';
  var tools = document.getElementById('tools');
  var foldBtn = document.getElementById('foldBtn');
  var setFold = function (on) {
    document.body.classList.toggle('folded', on);
    foldBtn.setAttribute('aria-expanded', on ? 'false' : 'true');
    if (on) {
      closePalette();
      toolbar.appendChild(tipsBtn);
    } else {
      tools.insertBefore(tipsBtn, tools.firstChild);
    }
    markStuck();
  };
  foldBtn.addEventListener('click', function () {
    var on = !document.body.classList.contains('folded');
    lsSet(FOLD_KEY, on ? '1' : '0');
    setFold(on);
  });
  setFold(lsGet(FOLD_KEY) === '1');

  window.addEventListener('storage', function (e) {
    if (e.key !== STORE) return;
    state = load();
    last = JSON.stringify(state);
    undos = [];
    redos = [];
    holdFiles();
    hideToast();
    show();
  });

  window.addEventListener('hashchange', function () {
    readPath();
    show();
  });

  readPath();
  show();
  navigator.locks.request(MY_UNDO, function () {
    return new Promise(function () {});
  });
  sweepFiles();
</script>
</body>
